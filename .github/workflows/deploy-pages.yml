name: Publish reviewed static Pages artifact

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'Mingcarehome/mingcare-intranet-test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Verify reviewed artifact structure
        run: |
          test -f site/index.html
          test -f site/404.html
          test -f site/.nojekyll
          test -z "$(find site -type l -print -quit)"
          test -z "$(find site -type f \( -name '.env*' -o -name '*.map' -o -name '*.ts' -o -name '*.tsx' -o -name '*.sql' -o -iname '*stamp*' -o -iname '*seal*' \) -print -quit)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          include-hidden-files: true

  deploy:
    if: github.repository == 'Mingcarehome/mingcare-intranet-test'
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
